services:
  - type: web
    name: brain-tumor-backend
    runtime: docker
    repo: https://github.com/YOUR_USERNAME/brain-tumor-yolo11
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: MODEL_PATH
        value: weights/best.pt
      - key: PORT
        value: 8000

  - type: web
    name: brain-tumor-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://brain-tumor-backend.onrender.com
